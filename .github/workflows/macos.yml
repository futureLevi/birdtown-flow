name: macOS

# Builds and tests the app on every push, renders every screen to PNG, and publishes the
# results (logs + snapshots, and on main the zipped .app) to the `snapshots/<branch>` branch
# so they can be reviewed without a Mac. On main it also refreshes the `nightly` release.

on:
  push:
    branches-ignore: ['snapshots/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, snapshot
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          # The workspace path is baked into .build's module cache, so a cache from another
          # checkout path (e.g. before the repo rename) can't be reused.
          key: spm-${{ runner.os }}-${{ github.event.repository.name }}-${{ hashFiles('Package.swift') }}-v2
          restore-keys: spm-${{ runner.os }}-${{ github.event.repository.name }}-

      - name: Build
        id: build
        run: |
          echo "::add-matcher::.github/swift-problem-matcher.json"
          set -o pipefail
          swift build 2>&1 | tee build.log
          echo "::remove-matcher owner=swift-compiler::"

      - name: Test
        id: test
        if: steps.build.outcome == 'success'
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log

      - name: Render snapshots
        id: snapshots
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p snapshots
          ( .build/debug/BirdtownFlow --render-snapshots "$PWD/snapshots" 2>&1 | tee snapshots.log ) &
          pid=$!
          for i in $(seq 1 420); do
            kill -0 $pid 2>/dev/null || break
            sleep 1
          done
          kill $pid 2>/dev/null || true
          ls -la snapshots | head -80

      - name: Export icon
        id: icon
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          .build/debug/BirdtownFlow --export-icon "$PWD/exported/AppIcon.iconset" "$PWD/exported/icon-1024.png" 2>&1 | tee export-icon.log

      - name: Cache speech models
        if: steps.build.outcome == 'success'
        uses: actions/cache@v4
        with:
          path: ~/Library/Application Support/FluidAudio/Models
          # Ultra for the smoke test; v3 and the CTC boosting model for the long-recording check.
          key: fluidaudio-models-ultra-v3-ctc-v1

      # `say` on a fresh runner sometimes writes a file with almost no audio ("86 samples,
      # 0.01 s" on several branches, with the app unchanged). Each file is checked for length
      # and made again, then with named voices, so the checks below test the app, not `say`.
      - name: Synthesize test speech
        id: synth
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          exec > >(tee synth.log) 2>&1
          synth() {  # synth <out.wav> <minimum seconds> <text>
            for voice in "" "" Samantha Daniel Fred; do
              rm -f synth.aiff
              say ${voice:+-v "$voice"} -o synth.aiff "$3" || true
              afconvert -f WAVE -d LEI16@16000 -c 1 synth.aiff "$1" 2>/dev/null || true
              bytes=$(stat -f%z "$1" 2>/dev/null || echo 0)
              if [ "$bytes" -ge $(( $2 * 32000 )) ]; then
                echo "$1: $(( bytes / 32000 )) s${voice:+ in $voice}"
                return 0
              fi
              echo "$1: only $bytes bytes from say${voice:+ -v $voice}, trying again"
              sleep 3
            done
            say -v '?' | head -20
            return 1
          }
          failed=0
          synth speech.wav 3 "Hello Birdtown Flow. This is a quick test of the dictation pipeline, um, running entirely on this Mac." || failed=1
          # About 100 s in three paragraphs, 0.6 s apart. The second has no punctuation, so it
          # has no pause to cut at; the third says the dictionary term about a second after
          # the gap before it, where a window is likely to start.
          synth long.wav 60 "Good morning everyone. Before we get into the numbers, I want to thank the support team for a remarkable quarter. \
          They answered more tickets than ever before, and our satisfaction scores went up at the same time. \
          That is not an accident. It comes from the training sessions we started in the spring, and from the new routing rules. \
          We will keep both, and next month we will add a weekly review of the hardest cases, so that everyone learns from them. \
          I also want to welcome the four people who joined us this quarter. Some of you have met them already. \
          If you have not, please find a moment this week to say hello, and show them how we work. \
          [[slnc 600]] \
          the second thing I want to cover is the launch plan for the autumn release which moves the beta \
          to the first week of October and the public release to the middle of November and gives the design team \
          two extra weeks to finish the onboarding flow and the new settings screens while engineering focuses on \
          performance and the long list of small fixes that customers keep asking about in every survey we send \
          [[slnc 600]] \
          Finally, Birdtown Flow will be part of the release, and we will dictate the release notes with it as a test. \
          If it does well, we will use it for the documentation too. The budget for next year is due at the end of the month. \
          Every team lead should have the template by now. Please keep the estimates honest, and tell me early if something \
          is likely to slip, because surprises in December help nobody. We have a lot to be proud of, and a lot still to do. \
          Please send me your questions before Friday, and I will answer them at the next meeting. \
          Thank you all for listening, and have a great week." || failed=1
          exit $failed

      - name: Speech smoke test
        id: speech
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -o pipefail
          .build/debug/BirdtownFlow --transcribe "$PWD/speech.wav" parakeetUltra 2>&1 | tee speech.log
          grep -qi "dictation" speech.log

      # A long recording transcribed whole and in windows must agree (`--compare-segmented`):
      # under 1% of words changed, no words doubled at a seam, windows not much slower than
      # the whole pass, at least one cut made without a pause, and the dictionary term out of
      # both.
      - name: Long recording check
        id: segmented
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set -o pipefail
          .build/debug/BirdtownFlow --transcribe "$PWD/long.wav" parakeetV3 --compare-segmented \
            --term "Birdtown Flow" --expect-forced 2>&1 | tee segmented.log

      - name: Build release app
        id: release
        if: github.ref == 'refs/heads/main' && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          # The icon comes from the logo's drawing code, exported in the step above.
          if [ -d exported/AppIcon.iconset ]; then
            rm -rf Resources/AppIcon.iconset && cp -R exported/AppIcon.iconset Resources/
            iconutil -c icns Resources/AppIcon.iconset -o Resources/AppIcon.icns > icon.log 2>&1 || echo "iconutil failed; using the committed icon" | tee -a icon.log
          fi
          make app CONFIG=release STAGE="$PWD/dist" 2>&1 | tee release.log
          cd dist && ditto -c -k --sequesterRsrc --keepParent "Birdtown Flow.app" BirdtownFlow.zip
          ls -la

      - name: Publish results branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BR="snapshots/${GITHUB_REF_NAME}"
          rm -rf out && mkdir -p out
          [ -d snapshots ] && cp -R snapshots out/ || true
          for f in build.log test.log snapshots.log release.log icon.log synth.log speech.log segmented.log export-icon.log; do [ -f "$f" ] && cp "$f" out/ || true; done
          grep -E "error:" build.log | sort -u | head -200 > out/errors.txt 2>/dev/null || true
          {
            echo "sha=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "build=${{ steps.build.outcome }}"
            echo "test=${{ steps.test.outcome }}"
            echo "snapshots=${{ steps.snapshots.outcome }}"
            echo "synth=${{ steps.synth.outcome }}"
            echo "speech=${{ steps.speech.outcome }}"
            echo "segmented=${{ steps.segmented.outcome }}"
            echo "release=${{ steps.release.outcome }}"
          } > out/status.txt
          if [ -f dist/BirdtownFlow.zip ]; then cp dist/BirdtownFlow.zip out/; fi
          # The exported icon set (and the .icns on main), so they can be reviewed and committed.
          if [ -d exported ]; then mkdir -p out/icon && cp -R exported/* out/icon/; fi
          if [ -f Resources/AppIcon.icns ] && [ -f icon.log ]; then cp Resources/AppIcon.icns out/icon/; fi
          cat out/status.txt
          cd out
          git init -q
          git checkout -q -b "$BR"
          git add -A
          git -c user.name="murmur-ci" -c user.email="ci@murmur.invalid" commit -q -m "CI ${GITHUB_SHA::8} on ${GITHUB_REF_NAME}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BR"

      - name: Update nightly release
        if: github.ref == 'refs/heads/main' && steps.release.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly dist/BirdtownFlow.zip \
            --title "Birdtown Flow nightly" \
            --notes "Built from ${GITHUB_SHA::8}. Unzip and move Birdtown Flow.app to Applications. It is not notarized, so the first launch is blocked: open System Settings → Privacy & Security and click Open Anyway (or run: xattr -dr com.apple.quarantine \"/Applications/Birdtown Flow.app\"). Ad-hoc signed, so re-grant Accessibility after each update." \
            --prerelease --target "${GITHUB_SHA}"

      - name: Fail if build or tests failed
        if: steps.build.outcome != 'success' || steps.test.outcome != 'success'
        run: exit 1

  dictionary-contract:
    name: Dictionary contract (vectors in sync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm the vectors on both sides are identical
        run: diff -q shared/dictionary-test-vectors.json Tests/MurmurDictionaryTests/dictionary-test-vectors.json
